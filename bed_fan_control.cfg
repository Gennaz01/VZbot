#####################################################################
#  BED FAN AUTOMATIC CONTROL
#  Gestione automatica della ventola "bed_fan" in base alla
#  temperatura della camera CHAMBER.
#####################################################################

# Macro che attiva il controllo automatico
[gcode_macro START_BED_FAN_CONTROL]
description: Avvia la gestione automatica della bed_fan in base alla temperatura camera
gcode:
    SET_GCODE_VARIABLE MACRO=BED_FAN_CONTROL VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=BED_FAN_CONTROL_DG DURATION=1

# Macro che disattiva il controllo e spegne la ventola
[gcode_macro STOP_BED_FAN_CONTROL]
description: Ferma la gestione automatica e spegne la bed_fan
gcode:
    SET_GCODE_VARIABLE MACRO=BED_FAN_CONTROL VARIABLE=enabled VALUE=0
    SET_FAN_SPEED FAN=bed_fan SPEED=0

# Contenitore variabili
[gcode_macro BED_FAN_CONTROL]
variable_enabled: 0
gcode:
    # nessun gcode — macro solo per contenere variabile
    M117 Bed Fan Control Loaded

# Routine ciclica che controlla temperatura e regola la ventola
[delayed_gcode BED_FAN_CONTROL_DG]
gcode:
    {% set en = printer["gcode_macro BED_FAN_CONTROL"].enabled %}

    {% if en %}
        {% set t = printer["temperature_sensor CHAMBER"].temperature %}

        {% if t < 50 %}
            SET_FAN_SPEED FAN=bed_fan SPEED=1.0
        {% elif t < 60 %}
            SET_FAN_SPEED FAN=bed_fan SPEED=0.5
        {% else %}
            SET_FAN_SPEED FAN=bed_fan SPEED=0.0
        {% endif %}

        UPDATE_DELAYED_GCODE ID=BED_FAN_CONTROL_DG DURATION=2
    {% endif %}

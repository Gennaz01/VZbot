########################################
# STEPPERS CONFIG
########################################

# S1
[stepper_x]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PE6
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 40
# endstop_pin: !PC15
position_endstop: -10
position_min: -10
position_max: 315
homing_speed: 100


# S2
[stepper_x1]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
microsteps: 16
full_steps_per_rotation: 200 ;1.8° stepper or 400 for 0.9° stepper
rotation_distance: 40


[stepper_y]

algorithm: bicubic
probe_count: 20,20

########################################
# FILGUARD
########################################

[filament_switch_sensor filament_breakage]
switch_pin: ^!PD15  # modifica se invertito
pause_on_runout: False
event_delay: 2.0
runout_gcode:
    PAUSE
    M117 Filament switch runout
insert_gcode:
    M117 Filament switch inserted



[filament_motion_sensor clogging_detection]
extruder: extruder
switch_pin: ^!PD13
pause_on_runout: False
detection_length: 10.0
runout_gcode:
   PAUSE
   M117 Filament encoder runout
insert_gcode:
   M117 Filament encoder inserted




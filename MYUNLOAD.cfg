[gcode_macro MYUNLOAD]
description: "Scarica il filamento con temperatura selezionabile"
variable_temp: 0
gcode:
  {% set temp = params.TEMP|default(0)|float %}
  {% if temp == 0 %}
    RESPOND PREFIX="MYUNLOAD" MSG="⚠️ Nessuna temperatura specificata. Usa ad esempio: MYUNLOAD TEMP=250"
    M117 "Specifica TEMP=xxx"
  {% else %}
    RESPOND PREFIX="MYUNLOAD" MSG="🔥 Riscaldo hotend a " ~ temp ~ "°C..."
    M104 S{temp}
    M109 S{temp}          ; attende il raggiungimento della temperatura

    RESPOND PREFIX="MYUNLOAD" MSG="▶ Estrudo 8mm per ammorbidire il filamento"
    G1 E8 F200

    RESPOND PREFIX="MYUNLOAD" MSG="🔄 Inizio retrazione progressiva"
    G1 E-5 F600
    G4 P500
    G1 E-90 F300

    RESPOND PREFIX="MYUNLOAD" MSG="✅ Filamento scaricato"
    M400
    M117 "Filamento scaricato"
  {% endif %}


